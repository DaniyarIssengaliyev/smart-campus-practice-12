<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Campus | Room 101</title><style>*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f1f5f9;color:#17233b;margin:0}header{background:#172d48;color:white;padding:22px max(20px,calc((100% - 960px)/2));font-weight:700}main{max-width:960px;margin:35px auto;padding:0 20px}h1{font-size:30px;margin-bottom:6px}p{line-height:1.5}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:white;border:1px solid #d8e2eb;padding:24px;border-radius:14px}label{display:block;margin:15px 0 5px;font-weight:600}input,select,button{font:inherit;width:100%;padding:12px;border:1px solid #b9c7d7;border-radius:8px;background:white}button{background:#175e91;color:white;border:0;font-weight:700;margin-top:20px;cursor:pointer}.result{padding:16px;background:#e8eef4;border-radius:8px;margin-top:16px;min-height:90px}.slot{padding:14px 0;border-bottom:1px solid #e0e6ed}small{color:#53667c}.good{background:#e0f4e8;color:#155a38}.bad{background:#fce9e7;color:#8c3026}@media(max-width:650px){.layout{grid-template-columns:1fr}main{margin-top:18px}}</style><header>SMART CAMPUS &nbsp; / &nbsp; Room availability</header><main><h1>Check Room 101</h1><p>Engineering Block · Demo clock: 08:30 · Fictional data</p><div class="layout"><section class="panel"><h2>Check availability</h2><form id="form" novalidate><label for="start">Start time (HH:MM)</label><input id="start" type="text" placeholder="HH:MM" value="10:30"><label for="duration">Duration (minutes)</label><input id="duration" type="number" value="60" min="1" max="120"><label for="status">Room status</label><select id="status"><option value="false">Open</option><option value="true">Blocked</option></select><button>Check availability</button></form><div id="result" class="result" aria-live="polite">Choose a time and check availability.</div></section><section class="panel"><h2>Existing bookings</h2><div id="bookings"></div><p><small>Checks do not create or modify bookings. Times are within a single fictional day.</small></p></section></div></main><script src="browser.js"></script></html>
